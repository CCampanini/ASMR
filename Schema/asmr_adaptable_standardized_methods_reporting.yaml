        last_updated_on: 2026-07-28
      institutionCode:
        alias: Institution Code
        description: A name (or acronym) in use by an institution having custody of a resource.
        comments: The institution having ownership of a resource should be given in dwc:ownerInstitutionCode.
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/institutionCode
        examples:
          - value: UNIVPM
          - value: Universitat de Barcelona
        range: string
        required: false
        recommended: true
        exact_mappings:
          - http://rs.tdwg.org/dwc/terms/institutionCode
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      institutionID:
        alias: Institution ID
        description: >-
          An identifier for the institution having custody of the object(s) or information referred to in the record.
          This identifier should point to a persistent, resolvable identifier, such as a Research Organization Registry
          (ROR) ID or ISNI (International Standard Name Identifier).
        comments: []
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/institutionID
        examples:
          - value: https://ror.org/042r9xb17
        range: string
        required: false
        recommended: true
        exact_mappings:
          - http://rs.tdwg.org/dwc/terms/institutionID
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      projectTitle:
        alias: Project Title
        description: Name of the project within which the sequencing was organized
        comments: >-
          Use this term to provide the official name or title of a project as it is commonly known and cited.
          Avoid abbreviations unless they are widely understood. The recommended best practice is to separate the
          values in a list with space vertical bar space ( | ).
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/projectTitle
        examples:
          - value: Forest soil metagenome
        range: string
        required: false
        recommended: true
        exact_mappings:
          - http://rs.tdwg.org/dwc/terms/projectTitle
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      projectID:
        alias: Project ID
        description: A brief, concise project identifier with no spaces or special
          characters, ensuring machine readability. This ID will be used in data file
          names as 'project_id'.
        comments: >
          A projectID may be shared in multiple distinct datasets.
          The nature of the association can be described in the metadata project description element.
          This term should be used to provide a globally unique identifier (GUID) for a project, if available.
          This could be a DOI, URI, or any other persistent identifier that ensures a project can be uniquely
          distinguished from others. Recommended best practice is to separate the values in a list with space
          vertical bar space ( | ).
        annotations:
          source:
            value: DwC
        slot_uri: https://w3id.org/nmdc/project_id
        examples:
          - value: noaa-aoml-gomecc4
        range: string
        required: false
        recommended: true
        exact_mappings:
          - https://w3id.org/nmdc/project_id
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      parentProjectID:
        alias: Parent Project ID
        description: >-
          An identifier or name of the overarching (parent) project that encompasses and organizes multiple
          related sub-projects, each identified by a unique project_id
        comments: []
        annotations:
          source:
            value: Fair eDNA
          slot_uri:
            value: not_available
        examples:
          - value: noaa-aoml-gomecc
        range: string
        required: false
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
