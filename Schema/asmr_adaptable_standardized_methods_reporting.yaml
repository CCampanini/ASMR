        comments: >-
          Recommended best practice is to use SI units, derived units, or other non-SI units accepted for use within
          the SI from a controlled vocabulary, e.g. QUDT Unit Vocabulary (http://qudt.org/vocab/unit/).
          Sampling unit can be expressed in terms of surface, e.g. for transects, or soaking time for stationary
          platforms.
