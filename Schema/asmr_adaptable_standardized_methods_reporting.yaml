      EssentialOceanVariables:
        alias: EOVs
        description: >-
          GOOS EOVs are defined as the minimum set of ocean variables that are needed to assess ocean
          state and variability for important global ocean phenomena, and to provide essential data for
          applications that support societal benefit. They are derived from sustained individual measurements,
          or combinations of measurements, that can be undertaken at global scale and in a cost-effective manner.
        comments: >-
          Each EOVs has a specification fact sheet accessible here (https://goosocean.org/document-list/168) with the
          explanation of its associated sub-variables, supporting variables, and derived products. This field can be
          compiled with broader EOVs (e.g. Inorganic carbon) band/or sub-variables and/or supporting variables
          and/or derived products.
        annotations:
          source:
            value: ASMR
          definition_source:
            value: >-
              Martín Míguez, Belén, et al. "GOOS Essential Ocean Variables: the backbone of a sustained and
              evolving global ocean observing system." Frontiers in Marine Science 13 (2026): 1737002.
          slot_uri:
            value: to_create
        examples:
          - value: Sea-surface temperature (SST)
          - value: Dissolved Inorganic Carbon (DIC) | Seagrass percent cover | Seagrass species composition
        required: false
        recommended: true
        range: string
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
