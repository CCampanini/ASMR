      image-overlap-fraction:
        alias: image overlap fraction
        description: >-
          The average overlap of two consecutive images i and j as the area images in both of the images (A_i * A_j)
          divided by the total area images by the two images
          (A_i + A_j - A_i * A_j): f = A_i * A_j / (A_i + A_j - A_i * A_j) -> 0 if no overlap.
          1 if complete overlap
        comments: []
        annotations:
          source:
            value: IFDO
          slot_uri:
            value: NA
        examples: []
        range: decimal
        required: false
        recommended: true
