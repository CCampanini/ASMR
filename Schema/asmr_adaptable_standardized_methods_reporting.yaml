  Location:
    attributes:
      locationID:
        alias: Location ID
        description: >-
          An identifier for a dcterms:Location.
        comments: >-
          Recommended best practice is to use a globally unique identifier (GUIDs). GUIDs can be retrieved/generated
          for example from Marine Regions Gazetteer (http://marineregions.org/) or GeoNames (http://www.geonames.org/).
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/locationID
        examples:
          - value: http://marineregions.org/mrgid/4012
          - value: https://www.geonames.org/3174307/cala-maestra.html
        range: string
        required: true
        recommended: false
        exact_mappings:
          - dwc:locationID
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      verbatimLocality:
        alias: Verbatim Locality
        description: An original textual description of a dcterms:Location.
        comments: >-
          Positive values are east of the Greenwich Meridian, negative values are
          west of it. Legal values lie between -180 and 180, inclusive.
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/verbatimLocality
        examples:
          - value: 25 km NNE Bariloche por R. Nac. 237
        range: string
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      locality:
        alias: Locality
        description: The specific description of the place.
        comments: >-
          Less specific geographic information can be provided in other geographic terms (dwc:higherGeography,
          dwc:continent, dwc:country, dwc:stateProvince, dwc:county, dwc:municipality, dwc:waterBody, dwc:island,
          dwc:islandGroup). This term may contain information modified from the original to correct perceived errors
          or standardize the description.
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/locality
        examples:
          - value: 25 km NNE Bariloche por R. Nac. 237
        range: decimal
        required: false
        recommended: true
        exact_mappings:
          - dwc:locality
        close_mappings: []
        related_mappings: []
