      samplingEffortProtocol:
        alias: Sampling Effort Protocol
        description: >-
          A description of or reference (publication or URL) to the methods used to determine the sampling effort.
        comments: >-
          This description should be associated with the values reported in eco:samplingEffortValue
          and eco:samplingEffortUnit. This is a specialization of eco:protocolDescriptions focused on effort,
          distinct from the survey method. The effort relates to the intensity of sampling and therefore can
          assist in interpreting estimates of completeness. If no sampling effort protocol can be reported, e.g. if
          ASMR metadata table is being compiled for an incidental discovery, fill with "Not applicable".
        annotations:
          source:
            value: Humboldt extension
        slot_uri: http://rs.tdwg.org/eco/terms/samplingEffortProtocol
        examples:
          - value: >-
              A single time-lapse set to shoot every 5 minutes deployed for a period of 15 days
