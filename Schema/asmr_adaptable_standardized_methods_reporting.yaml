  Parameters:
    attributes:
      inSituAbioticParametersCollected:
        alias: in Situ Abiotic Parameters Collected
        description: Abiotic parameters collected in situ during fieldwork.
        comments: >-
          Recommended best practice is to use a controlled vocabulary providing the label followed by the identifier
          between square brackets and to separate multiple values in a list with space vertical bar space ( | ).
          Controlled vocabularies with relevant terms include Environmental Thesaurus – Thesaurus for long term
          ecological research, monitoring and experiments (https://doi.org/10.48373/0PWD-C575),
          The Environment Ontology (ENVO, http://purl.obolibrary.org/obo/envo.owl), NERC Vocabulary Server
          (NVS, https://vocab.nerc.ac.uk/search_nvs/). If no abiotic parameters were collected in situ, fill with "No".
          If the compilation of the ASMR metadata table is *a posteriori* and dc:recordedBy has no information on the
          original sampling activity, fill with "Not reported".
        annotations:
          source:
            value: ASMR
          slot_uri:
            value: to_create
        examples:
          - value: >-
              Dissolved Organic Matter [http://vocab.nerc.ac.uk/collection/C77/current/B06/] |
              Turbidity of water in the water body by in-situ nephelometer
              [http://vocab.nerc.ac.uk/collection/P01/current/NEPHIF01/]
          - value: sediment granulometric fraction [http://vocabs.lter-europe.net/EnvThes/30113]
          - value: Water temperature
        range: string
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
