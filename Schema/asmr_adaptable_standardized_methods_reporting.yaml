      dataGeneralizations:
        alias: Data Generalization
        description: >-
          Actions taken to make the shared data (i.e. location, date) less specific or
          complete than in its original form. Suggests that alternative data of higher quality may
          be available on request. Note this is not related to genetic generalisation within bioinformatic
          workflows (i.e., OUT clustering).
        comments: []
        annotations:
          source:
            value: DwC
        slot_uri: http://rs.tdwg.org/dwc/terms/dataGeneralizations
        examples:
          - value: Coordinates generalized from original GPS coordinates to the nearest
              half degree grid cell.
        range: string
        required: false
        recommended: false
        exact_mappings:
          - http://rs.tdwg.org/dwc/terms/dataGeneralizations
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      bibliographicCitation:
        alias: Bibliographic Citation
        description: A bibliographic reference for the resource.
        comments: >-
          From Dublin Core, "Recommended practice is to include sufficient bibliographic detail to identify
          the resource as unambiguously as possible." The intended usage of this term in ASMR metadata checklist
          is the same as in Darwin Core, i.e.  is to provide the preferred way to cite the resource itself -
          "how to cite this record". Note that the intended usage of dcterms:references in Darwin Core,
          by contrast, is to point to the definitive source representation of the resource -
          "where to find the as-close-to-original reference", if one is available.
