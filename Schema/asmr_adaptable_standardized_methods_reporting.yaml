id: https://w3id.org/asmr

name: asmr_adaptable_standardized_methods_reporting

title: ASMR - Adaptable Standardized Methods Reporting

prefixes:
  ac: http://rs.tdwg.org/ac/terms/
  asmr: https://w3id.org/asmr/
  BODCParameterUsage: http://vocab.nerc.ac.uk/collection/P01/current/
  BODCParameterSemantic: http://vocab.nerc.ac.uk/collection/S18/current/
  cmecs: https://w3id.org/CMECS/
  dcterms: http://purl.org/dc/terms/
  DSInitiativeTypeCode: http://vocab:nerc:ac:uk/collection/G07/current/
  dwc: http://rs.tdwg.org/dwc/terms/
  eco: http://rs.tdwg.org/eco/terms/
  efo: http://www.ebi.ac.uk/efo/
  eLTER_CL: http://vocabs.lter-europe.net/elter_cl/
  esmo: http://purl.obolibrary.org/obo/esmo.owl
  iFDOCapture: https://ifdo-schema.org/standard/v2.2.1/documentation/iFDO-capture/
  iFDOContent: https://www:ifdo-schema:org/standard/v2:2:1/documentation/iFDO-content/
  iFDOCore: https://ifdo-schema.org/standard/v2.2.1/documentation/iFDO-core/
  ISGMMethods: https://pid.geoscience.gov.au/def/voc/ga/SeabedGeomorphologyGeneral/
  LifecycleEventType: http://rdf-vocabulary:ddialliance:org/cv/LifecycleEventType/1:0:2/
  linkml: https://w3id.org/linkml/
  marineregions: http://marineregions.org/
  MarineRegionsOntology: http://marineregions.org/ns/ontology
  MIxS: https://w3id.org/mixs/
  movebank: http://vocab.nerc.ac.uk/collection/MVB/current/
  nmcd: https://w3id.org/nmdc/
  obo: http://purl.obolibrary.org/obo/
  PATO: http://purl.obolibrary.org/obo/
  qudtUnit: http://qudt.org/vocab/unit/
  SeaDataNetParameterDiscoveryVocabulary: http://vocab.nerc.ac.uk/collection/P02/current/
  SimpleLithology: http://resource.geosciml.org/classifier/cgi/lithology/
  tern: https://w3id.org/tern/ontologies/tern/Sensor
  TRAITSTHES: https://kos:lifewatch:eu/thesauri/
  xmp: http://ns.adobe.com/xap/1.0/

default_prefix: asmr

imports:
  - linkml:types

classes:
  ASMRMetadata:
    attributes:
      dataLifeCycleStageAtCompilation:
        alias: Data Life Cycle Stage at Compilation
        description: >-
          Data life cycle stage at compilation of the current version of ASMR metadata table
        comments: >-
          Recommended best practice is to use a controlled vocabulary.
        annotations:
          source:
            value: asmr
          slot_uri:
            value: to_Create
        examples:
          - value: Study design [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/8e4ba08]
          - value: Data collection [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/8e4ba08]
          - value: Data Processing [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/552cf53]
          - value: A posteriori data harmonization
        range: string
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-30
        last_updated_on: 2026-07-30
      version:
        alias: Version
        description: >-
          ASMR metadata table version
        comments: >-
          Metadata Editors can associate different version coding, e.g. corresponding to the different data life stage
          at compilation.
        annotations:
          source:
            value: asmr
          slot_uri:
            value: to_Create
        examples:
          - value: 1.0
        range: string
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-30
        last_updated_on: 2026-07-30
      MetadataDate:
        alias: Metadata Date
        description: >-
          The date and time that any metadata for this resource was last changed.
        comments: >-
          Point in time recording when the last modification to metadata (not necessarily the media object itself)
          occurred. The date and time MUST comply with the World Wide Web Consortium (W3C) datetime practice,
          https://www.w3.org/TR/NOTE-datetime, which requires that date and time representation correspond to
          ISO 8601:1998, but with year fields always comprising 4 digits. This makes datetime records compliant
          with 8601:2004, https://www.iso.org/standard/40874.html. AC datetime values MAY also follow 8601:2004
          for ranges by separating two IS0 8601 datetime fields by a solidus ("forward slash", '/').
        annotations:
          source:
            value: xmp
          slot_uri:
            value: http://ns.adobe.com/xap/1.0/MetadataDate
        examples:
          - value: 2026-07-30T15:23Z
        range: string
        required: true
        recommended: false
        exact_mappings:
          - xmp:MetadataDate
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-31
        last_updated_on: 2026-07-31
      metadataCreator:
        alias: Metadata Creator
        description: A URI representing a person or organization originally creating the resource metadata record.
        comments: >-
          The person or organization originally creating the resource metadata record (irrespectively of its format)
          do not have to be necessarily the involved in the compilation of the ASMR metadata table, the person or
          organization involved in the compilation is specified with ac:metadataProvider. Recommended best practice is
          to separate the values in a list with space vertical bar space ( | ).
        annotations:
          source:
            value: Audiovisual Core Term List
        slot_uri: http://rs.tdwg.org/ac/terms/metadataCreator
        examples:
          - value: https://orcid.org/0000-0002-0260-8373
        range: string
        required: true
        recommended: false
        exact_mappings:
          - ac:metadataCreator
        close_mappings: []
        related_mappings:
          - LifecycleEventType:71dfa2a
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-31
        last_updated_on: 2026-07-30
      metadataCreatorLiteral:
        alias: Metadata Creator Literal
        description: >-
          Name of the person or organization originally creating the resource metadata record.
        comments: >-
          The person or organization originally creating the resource metadata record (irrespectively of its format)
          do not have to be necessarily the involved in the compilation of the ASMR metadata table, the person or
          organization involved in the compilation is specified with ac:metadataProvider. Recommended best practice is
          to separate the values in a list with space vertical bar space ( | ).
        annotations:
          source:
            value: Audiovisual Core Term List
        slot_uri: http://rs.tdwg.org/ac/terms/metadataCreatorLiteral
        examples:
          - value: Torcuato Pulido Mantas
        range: string
        required: false
        recommended: true
        exact_mappings:
          - ac:metadataCreatorLiteral
        close_mappings: []
        related_mappings:
          - LifecycleEventType:71dfa2a
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-31
        last_updated_on: 2026-07-31
      metadataProvider:
        alias: Metadata Provider
        description: URI of person or organization originally responsible for providing the resource metadata record.
        comments: >-
          Metadata Provider(s), i.e. people/organization compiling the ASMR metadata table do not have to be
          involved directly in the metadata generation and/or data generation or analysis and can be external to the
          project during which data were collected. The involvement of the Metadata Provider should be specified in
          asmr:metadataProviderInvolvementInDataLifeCycle. Recommended best practice is to separate the values in a
          list with space vertical bar space ( | ).
        annotations:
          source:
            value: Audiovisual Core Term List
        slot_uri: http://rs.tdwg.org/ac/terms/metadataProvider
        examples:
          - value: https://orcid.org/0009-0007-2258-2469
        range: string
        required: true
        recommended: false
        exact_mappings:
          - ac:metadataProvider
        close_mappings: []
        related_mappings:
          - LifecycleEventType:86d7722
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-30
        last_updated_on: 2026-07-30
      metadataProviderLiteral:
        alias: Metadata Provider Literal
        description: >-
          Name of the person or organization originally responsible for providing the resource metadata record.
        comments: >-
          Metadata Provider(s), i.e. people/organization compiling the ASMR metadata table do not have to be
          involved directly in the metadata generation and/or data generation or analysis and can be external to the
          project during which data were collected. The involvement of the Metadata Provider should be specified in
          asmr:metadataProviderInvolvementInDataLifeCycle. Recommended best practice is to separate the values in a
          list with space vertical bar space ( | ).
        annotations:
          source:
            value: Audiovisual Core Term List
        slot_uri: http://rs.tdwg.org/ac/terms/metadataProviderLiteral
        examples:
          - value: Veronica Marchesi
        range: string
        required: false
        recommended: true
        exact_mappings:
          - ac:metadataProviderLiteral
        close_mappings: []
        related_mappings:
          - LifecycleEventType:86d7722
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-30
        last_updated_on: 2026-07-30
      metadataProviderInvolvementInDataLifeCycle:
        alias: Metadata Provider Involvement in Data Life Cycle
        description: >-
          Involvement of the ac:metadataProvider compiling ASMR metadata table during data life cycle
        comments: >-
          Recommended best practice is to separate the values in a list with space vertical bar space ( | ).
        annotations:
          source:
            value: asmr
          slot_uri:
            value: to_Create
        examples:
          - value: >-
              Study design [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/8e4ba08] |
              Data collection [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/8e4ba08]
          - value: Data processing
          - value: External (no involvement in data generation/processing)
        range: string [http://rdf-vocabulary.ddialliance.org/cv/LifecycleEventType/1.0.2/552cf53]
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-30
        last_updated_on: 2026-07-30
