        description: >-
          eco:samplingEffortUnit excluded from analysis.
        comments: >-
          This term can provide information of the efficiency and intrinsic / extrinsic limitations of the
          eco:samplingEffortProtocol.
          Best recommended practice is to specify the number of excluded sampling effort units followed by the sampling
