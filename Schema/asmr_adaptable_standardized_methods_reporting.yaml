          - value: https://orcid.org/0000-0002-1825-0098
        range: string
        required: false
        recommended: true
        exact_mappings:
          - http://rs.tdwg.org/dwc/terms/recordedByID
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-28
      projectContact:
        alias: Project Contact
        description: >-
          A contact person and their contact (i.e., email address) for data enquiry
        comments: []
        annotations:
          source:
            value: Fair eDNA
          slot_uri:
            value: NA
        examples:
          - value: xxxx@yyyy.com
        range: string
        required: true
        recommended: false
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
