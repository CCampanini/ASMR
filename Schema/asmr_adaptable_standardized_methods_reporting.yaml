  CostAnalysis:
    description: >-
      Information describing the costs associated with implementation of the method.
    comments: >-
      Completion of this class is particularly relevant for methodological studies aiming to present innovative
      sampling materials or protocol or to evaluate and compare the cost-effectiveness, logistical requirements,
      and resource demands of fieldwork methods.
    attributes:
      costAnalysisDescriptions:
        alias: Cost Analysis Descriptions
        description: >-
          Description of the protocol used to conduct the cost analysis.
        comments: >-
          Recommended best practice is to explain thoroughly the protocol, rationale and any relevant information to
          understand how the cost analysis was conducted.
        annotations:
          source:
            value: ASMR
          slot_uri:
            value: to_create
        examples:
          - value: >-
              We analyzed the cost of restoring a population (100 m2) considering the travel from our institution (i.e.
              100 km ca by car), transportation (boat rental), personnel and material expenses (except for diving
              equipment), but not the long-term monitoring costs.
        range: string
        required: false
        recommended: true
        exact_mappings: []
        close_mappings: []
        related_mappings: []
        narrow_mappings: []
        broad_mappings: []
        created_on: 2026-07-28
        last_updated_on: 2026-07-29
      costAnalysisUnit:
        alias: Cost Analysis Unit
        description: >-
          Unit for the cost analysis of the described eco:samplingEffortProtocol.
        comments: >-
          Depending of the eco:samplingEffortProtocol, asmr:costAnalysisUnit can correspond to the
          eco:samplingEffortUnit, the cost to perform the eco:samplingEffortProtocol at one site or any other cost unit
          considered sensible/practical for the cost analysis. Example may be surveying one site for a monitoring
          program or restoring a surface unit / number of colony for a restoration project.
        annotations:
          source:
            value: ASMR
          slot_uri:
            value: to_create
        examples:
          - value: cost per surveyed m^2
          - value: cost per transplanted coral colony
          - value: cost per surveyed site
        range: string
        required: false
        recommended: true
        exact_mappings: []
        close_mappings: []
