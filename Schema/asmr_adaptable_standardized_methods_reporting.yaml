      verbatimConservationMeasure:
        alias: Verbatim Conservation Measure
        description: >-
          Original textual description of any conservation measures or regulation in place at the dwc:locationID
          at the time of sampling.
        comments: >-
          Conservation measures should be filled by the users with no restricted values or if it is compiled
          *a posteriori* as it is reported in text. Recommended best practice is to fill this field with "Not reported
          if not reported in text or "No" if no conservation measure or regulation at the dwc:locationID when the
          dwc:event occurred
        annotations:
          source:
            value: ASMR
          slot_uri:
            value: NA
        examples:
          - value: bottom trawling ban
          - value: 'MPA, established in 1999, covers an area of around 4km2, divided into three conservation zones:
              Zone A (strict reserve), Zone B (general reserve) and Zone C (partial reserve). Entry into Zone A is only
               permitted for surveillance, rescue, research and service operations. In Zone B, bathing, diving and
               mooring at authorised facilities for small sailing and rowing boats are allowed.
               Additionally, sport and professional fishing is permitted but only for residents.
               In Zone C, all the activities allowed in Zone B are permitted, and sport fishing is not limited to
               residents only (Salmona and Verardi 2001).'
        required: false
        recommended: true
