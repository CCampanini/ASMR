        description: The taxonomic group(s) targeted for sampling during the dwc:Event.
        comments: >-
          This term is meant to alert users to the presence of non-target taxa (in some disciplines called 'bycatch')
          reported in this dwc:Event. This term is relevant only if a target taxonomic scope is declared.
          Taxonomic scope is based on the combination of eco:targetTaxonomicScope and eco:excludedTaxonomicScope.
          Examination of the taxonomic scope is needed in order to identify the non-target taxa.
          It should be possible to confirm the expectations by investigating the dwc:Occurrences in this dwc:Event and
          in its child dwc:Events (if available) or by exploring eco:nonTargetTaxa for this dwc:Event (if populated).
          The value of this term should be 'true' if dwc:Occurrences of taxa outside the taxonomic scope as defined at
          the time of the dwc:Event are reported, otherwise the value of this term should be 'false'.
